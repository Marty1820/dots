# Shell Prompt Configuration
# Configuration reference: https://starship.rs/config/

# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"
palette = "tokyo_night"
scan_timeout = 60

add_newline = true

format = """\
[](fg:lavender)\
$directory\
${custom.directory_separator_not_git}\
${custom.directory_separator_git}\
$symbol($git_branch[](fg:pink))\
$symbol( $git_commit$git_status$git_metrics$git_state) $fill$cmd_duration$all\
$character"""

continuation_prompt = "[❯❯](bold green)"

[fill]
symbol = " "

[character]
format = "$symbol "
success_symbol = "[ ❯](bold green)"
error_symbol = "[ ❯](bold red)"

[line_break]
disabled = false

[directory]
truncate_to_repo = true
format = "[ $path ]($style)"
style = "bold fg:base bg:lavender"
read_only = ""
read_only_style = "red"
truncation_symbol = ".../"
home_symbol = "~"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""
"Videos" = ""
".config" = ""
"dots" = ""

[git_branch]
symbol = ""
format = "[ $symbol$branch(:$remote_branch) ]($style)"
style = "fg:base bg:pink"

[git_metrics]
disabled = false

[git_status]
style = "fg:base bg:red"

[cmd_duration]
min_time = 500
format = "[  $duration ]($style)"
style = "yellow"

[battery]
format = "[$symbol $percentage]($style)"
charging_symbol = ""
discharging_symbol = "󰂃"

[[battery.display]]
threshold = 10
style = "red"

[[battery.display]]
threshold = 20
style = "yellow"

[custom.directory_separator_git]
description = "Output a styled separator right after the directory when inside a git repository."
command = ""
format = "[](fg:lavender bg:pink)"
# Only when inside git repository
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"

[custom.directory_separator_not_git]
description = "Output a styled separator right after the directory when NOT inside a git repository."
command = ""
format = "[](fg:lavender)"
# Only when NOT inside a git repository
when = "! git rev-parse --is-inside-work-tree > /dev/null 2>&1"

[python]
symbol = "󰌠 "

[lua]
symbol = " "

# Define color palette
[palettes.tokyo_night]
pink = "#bb9af7"
red = "#f7768e"
yellow = "#e0af68"
green = "#9ece6a"
teal = "#1abc9c"
blue = "#7aa2f7"
lavender = "#ff9e64"
text = "#c0caf5"
base = "#1a1b26"
